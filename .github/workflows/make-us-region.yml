name: make-us-region

# One-off helper: builds the US region polygon (Census states + 50 km) used by basemap-us. Run by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin
          pip install --quiet shapely==2.0.7 pyproj==3.7.0
          curl -fsSL -o states.zip https://www2.census.gov/geo/tiger/GENZ2024/shp/cb_2024_us_state_5m.zip
          ogr2ogr -f GeoJSON -t_srs EPSG:4326 states.geojson "/vsizip/states.zip"
          python3 scripts/make_us_region.py states.geojson us.geojson
          ls -l us.geojson
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: us-region
          path: us.geojson
