name: layer-usfs-trails-roads

# Builds the layer and publishes it to R2. Runs only by hand or on schedule, never on pull requests.
on:
  workflow_dispatch:
    inputs:
      region:
        description: Region slug (us = national build; anything else is a test run with the bbox below)
        default: us
      bbox:
        description: Test-run bounding box west,south,east,north (ignored for us)
        default: ""
  schedule:
    - cron: "17 5 11 * *"

permissions:
  contents: read

concurrency:
  group: r2-catalogue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: scripts/setup-tools.sh
      - name: Build and publish
        env:
          REGION: ${{ inputs.region || 'us' }}
          BBOX: ${{ inputs.bbox || '' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: scripts/build-usfs-trails-roads.sh
