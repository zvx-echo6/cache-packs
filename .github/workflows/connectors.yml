name: connectors

# Publishes connectors/ (the live data connector catalogue and its definitions) to R2 under connectors/, so the app reads
# https://cache.echo6.co/connectors/catalogue.json. No build step: the files are static. Runs when connectors/ changes on main, or by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "connectors/**"
      - ".github/workflows/connectors.yml"

permissions:
  contents: read

# Only this workflow writes under connectors/ in the bucket (the layer workflows write the catalogue at the bucket root).
concurrency:
  group: r2-connectors
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check the catalogue and the definitions
        env:
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: python3 -I connectors/check_connectors.py connectors
      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: connectors/publish_connectors.sh connectors
