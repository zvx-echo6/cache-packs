# Informal regions: each one is a union of catalogue regions (states/provinces, counties, districts).
# Edit freely: the build reads this file; ids of members must exist in the catalogue (ids.tsv in the build artifact lists them).
# Fields: id (stable slug you choose), name, kind (multi_state | multi_country | sub_state | valley | metro_alias),
#         aliases (extra search names), members (catalogue ids; the polygon is their union), description, source.
# Nesting is automatic: a region whose members are all inside a bigger informal region becomes its child.
# Where there is no official grouping the source line says so; those are documented choices, not facts.
version: 1
